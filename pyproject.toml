[project]
name = "verso"
version = "1.0.0"
description = "Verso: an agentic auditor that finds specification gaps in program repair benchmarks."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.107",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[project.scripts]
verso = "verso.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verso*"]
